name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "pypy3.11"]
    env:
      # A missing validator (pikepdf, pypdf, pypdfium2) fails the run
      # instead of skipping the tests that need it.
      PDFRW_REQUIRE_VALIDATORS: "1"
      PYTHONWARNINGS: error
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install
        # PYTHONWARNINGS would turn pip's own deprecation warnings into
        # errors, so it is cleared for the install step only.
        env:
          PYTHONWARNINGS: ""
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test -e ".[crypto]"

      - name: Import under -W error (upstream #170)
        run: python -W error -c "import pdfrw, pdfrw.crypt, pdfrw.toreportlab, pdfrw.findobjs"

      - name: Test
        run: >
          python -m pytest
          --cov=pdfrw --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
